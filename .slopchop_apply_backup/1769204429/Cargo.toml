[package]
name = "nitrate"
version = "0.1.0"
edition = "2021"
description = "Physics-based film simulation engine"

[dependencies]
dioxus = { version = "0.6", features = ["desktop"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"

# Phase 2: Image I/O
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rfd = "0.15"
base64 = "0.22"

# Phase 3+ (uncomment when needed)
# wgpu = "24.0"
# bytemuck = { version = "1.14", features = ["derive"] }
# glam = "0.29"

[profile.release]
lto = true
codegen-units = 1
opt-level = "z"
