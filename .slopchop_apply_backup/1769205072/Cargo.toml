[package]
name = "nitrate"
version = "0.1.0"
edition = "2021"
description = "Physics-based film simulation engine"

[dependencies]
dioxus = { version = "0.6", features = ["desktop"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
rfd = "0.15"

[profile.release]
lto = true
codegen-units = 1
opt-level = "z"
