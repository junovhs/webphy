[package]
name = "nitrate-pal"
version.workspace = true
edition.workspace = true
description = "Platform Abstraction Layer - Native Vulkan/D3D12/Metal with wgpu HAL bridge"

[features]
default = ["vulkan"]
vulkan = ["ash", "ash-window"]

[dependencies]
# Error handling
anyhow.workspace = true
thiserror.workspace = true

# Logging
tracing.workspace = true

# Graphics - wgpu with HAL access
wgpu = { workspace = true, features = ["vulkan-portability"] }

# Window handling
winit.workspace = true
raw-window-handle.workspace = true

# Vulkan (Linux primary)
ash = { workspace = true, optional = true }
ash-window = { workspace = true, optional = true }

# Collections
arrayvec.workspace = true

[dev-dependencies]
tracing-subscriber = { workspace = true }
pollster = "0.4"
