[rules]
max_file_tokens = 2000
max_cognitive_complexity = 25
max_nesting_depth = 3
max_function_args = 5
max_function_words = 10
max_lcom4 = 1
min_ahf = 60.0
max_cbo = 9
max_sfout = 7
ignore_naming_on = []
ignore_tokens_on = [
    "Cargo.lock",
    "package-lock.json",
    "README.md",
    "docs",
    "target",
    "vendor",
]

[rules.safety]
require_safety_comment = true
ban_unsafe = false

[rules.locality]
max_distance = 4
l1_threshold = 2
hub_threshold = 1.0
min_hub_afferent = 5
god_module_threshold = 20
deadwood_threshold = 2
mode = "warn"
exempt_patterns = []

[preferences]
auto_copy = true
auto_format = false
system_bell = false
backup_retention = 5
progress_bars = true
require_plan = true
write_fix_packet = false
fix_packet_path = "slopchop-fixme.txt"
auto_promote = false

[commands]
check = [
    "cargo clippy --all-targets -- -D warnings -W clippy::pedantic",
    "cargo test",
]
fix = ["cargo fmt"]
